{% extends "aa_eveaio/base.html" %}
{% load i18n %}

{% block eveaio_content %}
<h1>{% translate "Deactivate EVE AIO" %}</h1>
<div class="card card-danger">
    <div class="card-body">
        <p>{% translate "This will remove your key. EVE AIO will no longer use Alliance Auth data for this account." %}</p>
        <form method="post">
            {% csrf_token %}
            <div class="d-flex flex-wrap gap-2">
                <button type="submit" class="btn btn-danger">
                    <i class="fa-solid fa-xmark fa-fw"></i>
                    {% translate "Deactivate" %}
                </button>
                <a href="{% url 'aa_eveaio:index' %}" class="btn btn-secondary">
                    {% translate "Cancel" %}
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
